<!DOCTYPE html>
<html>
<head>
    <title>Ticket Details</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Ticket Details</h2>

    <p><b>Title:</b> {{ ticket.title }}</p>
    <p><b>Description:</b> {{ ticket.description }}</p>

    <form method="POST">
        {% csrf_token %}

        <label>Status</label>
        <select name="status">

            <option value="In Progress"
                {% if ticket.status == "In Progress" %}selected{% endif %}>
                In Progress
            </option>

            <option value="Closed"
                {% if ticket.status == "Closed" %}selected{% endif %}>
                Closed
            </option>

        </select>

        <button type="submit">Update</button>
    </form>

    <a href="/">Back</a>
</div>

</body>
</html>
