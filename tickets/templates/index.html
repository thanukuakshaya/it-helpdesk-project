<!DOCTYPE html>
<html>
<head>
    <title>IT Helpdesk</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .create-link {
            display: block;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }

        .tickerow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .status-inprogress {
            color: orange;
            font-weight: bold;
        }

        .status-closed {
            color: green;
            font-weight: bold;
        }

        .status-open {
            color: rgb(237, 72, 6);
            font-weight: bold;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            color: white;
            background-color: #007bff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>IT Helpdesk</h1>

    <!-- ✅ FIXED LINK -->
    <a href="/create/" class="create-link">+ Create Ticket</a>

    <hr>

    {% for ticket in tickets %}
    <div class="tickerow">

        <!-- LEFT -->
        <div>
            <b>{{ ticket.title }}</b> —
            <span class="status-{{ ticket.status|lower|cut:' ' }}">
                {{ ticket.status }}
            </span>
        </div>

        <!-- RIGHT BUTTON -->
        <div>
            <a href="/ticket/{{ ticket.id }}/" class="btn">Open</a>
        </div>

    </div>
    {% endfor %}

</div>

</body>
</html>
